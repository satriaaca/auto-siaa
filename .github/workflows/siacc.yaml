name: SIACC Auto Poster

on:
  schedule:
    # cron runs in UTC; WITA = UTC+8
    - cron: "0 0 * * *"   # 08:00 WITA
    - cron: "0 8 * * *"   # 16:00 WITA
  workflow_dispatch:
    inputs:
      mode:
        description: "Target"
        type: choice
        options: [Draft, Post]
        default: Draft
      max_articles:
        description: "Max articles this run"
        default: "30"
      dry_run:
        description: "Scrape only, don't post"
        type: boolean
        default: false

concurrency:
  group: siacc-bot
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit state/posted_urls.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SIACC_TOKEN: ${{ secrets.SIACC_TOKEN }}
          SIACC_MODE: ${{ github.event.inputs.mode || vars.SIACC_MODE || 'Draft' }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || vars.MAX_ARTICLES || '30' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WORKERS: ${{ vars.WORKERS || '5' }}
          VERIFY_SSL: ${{ vars.VERIFY_SSL || 'true' }}
        run: python main.py

      - name: Upload scraped output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siacc-output-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit dedupe state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted_urls.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update posted state"
            git pull --rebase
            git push
          fi