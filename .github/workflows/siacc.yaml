name: SIACC Auto Poster

on:
  schedule:
    # cron berjalan dalam UTC; WITA = UTC+8
    - cron: "0 0 * * *"   # 08:00 WITA
    - cron: "0 8 * * *"   # 16:00 WITA
  workflow_dispatch:
    inputs:
      mode:
        description: "Target"
        type: choice
        options: [Draft, Post]
        default: Draft
      max_articles:
        description: "Maksimal artikel per run"
        default: "30"
      dry_run:
        description: "Scrape saja, jangan posting"
        type: boolean
        default: false

concurrency:
  group: siacc-bot
  cancel-in-progress: false

permissions:
  contents: write   # untuk commit state/posted_urls.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Kalau SIACC_TOKEN disimpan sebagai *Environment secret*,
    # hapus tanda # di bawah dan ganti dengan nama environment kamu:
    # environment: production

    env:
      # Fallback ke vars supaya tetap jalan kalau token terlanjur disimpan di tab Variables.
      # Setelah berhasil, sebaiknya pindahkan ke Secrets.
      SIACC_TOKEN: ${{ secrets.SIACC_TOKEN || vars.SIACC_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check token
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$SIACC_TOKEN" ]; then
            echo "::error::SIACC_TOKEN kosong. Cek: nama secret, tab Secrets (bukan Variables/Dependabot), repo yang benar, atau Environment secret (lihat baris 'environment:')."
            exit 1
          fi
          echo "Token terisi (${#SIACC_TOKEN} karakter)"

      - name: Run bot
        env:
          SIACC_MODE: ${{ github.event.inputs.mode || vars.SIACC_MODE || 'Draft' }}
          MAX_ARTICLES: ${{ github.event.inputs.max_articles || vars.MAX_ARTICLES || '30' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WORKERS: ${{ vars.WORKERS || '5' }}
          VERIFY_SSL: ${{ vars.VERIFY_SSL || 'true' }}
        run: python main.py

      - name: Upload scraped output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siacc-output-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit dedupe state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted_urls.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update posted state"
            git pull --rebase
            git push
          fi